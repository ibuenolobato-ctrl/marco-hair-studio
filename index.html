<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="index, follow">
  <!--SALON_SEO-->
</head>
<body>
  <div id="wireframe-banner" class="hidden border-b border-[color-mix(in_srgb,var(--color-ink)_12%,transparent)] bg-[var(--color-surface)] px-4 py-2 text-center text-xs font-medium text-[var(--color-muted)]">
    Vista wireframe de maquetación (solo desarrollo). Edita <code class="font-mono text-[var(--color-ink)]">src/config/salon.config.js</code> para cargar datos reales.
  </div>

  <div class="mx-auto flex min-h-dvh w-full max-w-2xl flex-col px-4 py-6 sm:px-6 sm:py-10">
    <!-- CABECERA COMPACTA -->
    <header id="salon-header" class="pb-6 border-b border-[color-mix(in_srgb,var(--color-ink)_12%,transparent)]"></header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 space-y-10 py-8">
      <!-- SERVICIOS -->
      <section id="servicios" aria-labelledby="services-heading" class="space-y-4">
        <div class="flex items-baseline justify-between gap-3">
          <h2 id="services-heading" class="text-lg font-bold tracking-tight">Servicios</h2>
          <span id="services-count" class="text-xs font-medium text-[var(--color-muted)] badge-pill"></span>
        </div>
        <div id="services-list" class="space-y-3"></div>
      </section>

      <!-- RESERVAS -->
      <section id="reservar" aria-labelledby="booking-heading" class="space-y-4">
        <div class="space-y-1">
          <h2 id="booking-heading" class="text-lg font-bold tracking-tight">Reservar cita</h2>
          <p id="active-service-label" class="text-sm text-[var(--color-muted)]"></p>
        </div>

        <div id="booking-container" class="surface-card p-4 sm:p-5 space-y-4"></div>
        <div id="booking-secondary-actions" class="flex flex-wrap items-center gap-3"></div>
      </section>
    </main>

    <!-- PIE MÍNIMO -->
    <footer id="salon-footer" class="pt-6 border-t border-[color-mix(in_srgb,var(--color-ink)_12%,transparent)] text-xs text-[var(--color-muted)]"></footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
