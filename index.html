<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!--SALON_SEO-->
</head>
<body>
  <div id="wireframe-banner" class="hidden border-b ios-divider bg-[var(--color-surface)] px-4 py-2 text-center text-xs font-medium text-[var(--color-muted)]">
    Vista wireframe de maquetación (solo desarrollo). Edita <code class="font-mono text-[var(--color-ink)]">src/config/salon.config.js</code> para cargar datos reales.
  </div>

  <div class="mx-auto flex min-h-dvh w-full max-w-lg flex-col gap-7 px-4 py-6 sm:py-10">
    <!-- CABECERA TIPO PERFIL DE NEGOCIO -->
    <header id="salon-header"></header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 space-y-7">
      <!-- SERVICIOS DE PELUQUERÍA -->
      <section id="servicios" aria-labelledby="services-heading" class="space-y-2.5">
        <div class="flex items-center justify-between gap-3">
          <h2 id="services-heading" class="ios-section-label">Servicios de peluquería</h2>
          <span id="services-count" class="px-3 text-xs font-medium text-[var(--color-muted)] tabular-nums badge-pill"></span>
        </div>
        <div id="services-list"></div>
      </section>

      <!-- RESERVAR CITA -->
      <section id="reservar" aria-labelledby="booking-heading" class="space-y-2.5">
        <div class="space-y-1">
          <h2 id="booking-heading" class="ios-section-label">Reservar cita</h2>
          <p id="active-service-label" class="px-3 text-xs text-[var(--color-muted)]"></p>
        </div>

        <div id="booking-container" class="ios-card p-5 space-y-4"></div>
        <div id="booking-secondary-actions" class="flex flex-wrap items-center gap-2.5 px-1"></div>
      </section>
    </main>

    <!-- INFORMACIÓN PRÁCTICA -->
    <footer id="salon-footer" class="space-y-2.5 pb-2"></footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
